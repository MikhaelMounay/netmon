[package]
name = "controller"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = { workspace = true }
log = { workspace = true }

[package]
name = "netmon"
version = "0.1.0"
description = "Network Monitor with Blocking and Bandwidth Limiting"
authors = ["You"]
edition = "2021"

[lib]
name = "netmon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "netmon"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["api-all", "system-tray", "window-set-title", "window-set-focus"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
once_cell = "1.19"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]